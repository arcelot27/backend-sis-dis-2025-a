spring.application.name=AgendaManager
spring.datasource.url=jdbc:mysql://localhost:3306/agenda_manager
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Usuario por defecto (solo para desarrollo)
spring.security.user.name=admin
spring.security.user.password=12345
spring.security.user.roles=ADMIN


# Para evitar conflictos con el routing de Angular
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Si Angular maneja el login
security.ignored=/**